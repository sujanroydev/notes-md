<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2563eb">
    <title>Offline · NOTES.md</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; }
      main { box-sizing: border-box; width: min(100% - 2rem, 28rem); padding: 2rem; border: 1px solid #e2e8f0; border-radius: 1rem; background: #fff; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { line-height: 1.6; color: #475569; }
      a { display: inline-block; margin-top: .5rem; color: #1d4ed8; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f172a; color: #f8fafc; }
        main { border-color: #334155; background: #1e293b; }
        p { color: #cbd5e1; }
        a { color: #93c5fd; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You’re offline</h1>
      <p>NOTES.md can’t reach the server right now. Work notes require a connection; edits are not queued or reported as synchronized.</p>
      <p>Personal notes remain stored locally in this browser when the Personal app shell is available.</p>
      <a href="/personal">Open Personal mode</a>
    </main>
  </body>
</html>
